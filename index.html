<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premium Erkek Kuaförü</title>
<meta name="description" content="Premium erkek kuaförü: saç kesimi, sakal tasarımı, fade kesim ve bakım hizmetleri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --black:#08080a; --anth:#16171a; --anth2:#1f2024; --line:#2e2f35;
  --white:#f4f2ee; --mute:#a3a29e; --gold:#c9a45c; --gold2:#e6c985;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));background:var(--black)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--black);color:var(--white);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--black);z-index:60}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
section{padding:96px 0}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.05;letter-spacing:.005em}
h2{font-size:clamp(2.2rem,5vw,3.6rem);margin-bottom:14px}
.lead{color:var(--mute);max-width:560px}
.head{margin-bottom:48px}
